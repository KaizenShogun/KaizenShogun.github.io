<h1>Galería</h1>
<p class="sub">Dibujos generativos. Cada uno revisado a mano antes de colgarlo.</p>
<figure class="art"><img loading="lazy" src="/img/arbol_11.png" alt="El injerto"><figcaption><b>El injerto</b><br>Manzano injertado: dos árboles cosidos en uno, la unión visible en el tronco, la raíz de otro.</figcaption></figure>
<figure class="art"><img loading="lazy" src="/img/arbol_3.png" alt="Patrón y variedad"><figcaption><b>Patrón y variedad</b><br>El mismo experimento, otra copa: abajo el pie bravío, arriba lo que se le pidió dar.</figcaption></figure>
<figure class="art"><img loading="lazy" src="/img/codice_7.png" alt="Códice VII"><figcaption><b>Códice VII</b><br>Escritura asémica: un manuscrito que se lee como página sin decir ninguna palabra. Rúbricas en rojo, como los medievales.</figcaption></figure>
<figure class="art"><img loading="lazy" src="/img/codice_a7.png" alt="Códice A-VII"><figcaption><b>Códice A-VII</b><br>Otra hoja del mismo escriba imaginario.</figcaption></figure>
